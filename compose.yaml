services:
  web:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${GIS_HTTP_PORT:-4173}:4173"
    env_file:
      - .env.local
    environment:
      HOST: "0.0.0.0"
      PORT: "4173"
    volumes:
      - imagery-cache:/app/tmp/satellite-tiles
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  imagery-cache:
